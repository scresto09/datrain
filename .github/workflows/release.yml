name: Release

# Pushing a tag such as v1.2.0 publishes the signed APK as a GitHub release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The changelog needs the previous tag.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag must look like v1.2.0" >&2
            exit 1
          fi
          # Always increasing, as Android requires for an update: 1.2.0 -> 10200.
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"

      # The app signing key, the same as on Google Play, so that every store's APK can update the others.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DATRAIN_APP_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DATRAIN_APP_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DATRAIN_APP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DATRAIN_APP_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/app.jks"
          {
            echo "app.storeFile=$RUNNER_TEMP/app.jks"
            echo "app.storePassword=$STORE_PASSWORD"
            echo "app.keyAlias=$KEY_ALIAS"
            echo "app.keyPassword=$KEY_PASSWORD"
          } > signing.properties

      - name: Build
        run: ./gradlew --no-daemon :app:assembleRelease -PdatrainSigning=app -PdatrainVersionName="$VERSION" -PdatrainVersionCode="$VERSION_CODE"

      - name: Remove the key
        if: always()
        run: rm -f signing.properties "$RUNNER_TEMP/app.jks"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="datrain-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha=$(sha256sum "$apk" | cut -d ' ' -f 1)
          echo "$sha  $apk" > "$apk.sha256"
          previous=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo "## Changes"
            git log --no-merges --pretty='- %s' ${previous:+"$previous.."}"$GITHUB_REF_NAME"
            echo
            echo "## SHA-256"
            echo
            echo '```'
            echo "$sha  $apk"
            echo '```'
            echo
            echo "## Source code"
            echo
            echo "https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_REF_NAME"
          } > notes.md
          # A release already made by hand for this tag (from GitHub's page) gets the files and notes instead.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$apk" "$apk.sha256" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "Datrain $VERSION" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" "$apk" "$apk.sha256" --title "Datrain $VERSION" --notes-file notes.md
          fi
