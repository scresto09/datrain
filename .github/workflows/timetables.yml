name: Timetables

# After the 17:00 Paris update of IDFM, in summer and winter time.
on:
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: timetables
  cancel-in-progress: true

env:
  SNCF_URL: https://eu.ftp.opendatasoft.com/sncf/plandata/Export_OpenData_SNCF_GTFS_NewTripId.zip
  IDFM_URL: https://data.iledefrance-mobilites.fr/explore/dataset/offre-horaires-tc-gtfs-idfm/files/a925e164271e4bca93433756d6a340d1/download/
  IDFM_STOPS_URL: https://data.iledefrance-mobilites.fr/api/explore/v2.1/catalog/datasets/arrets/exports/csv?select=arrid,zdaid&where=arrtype%3D%22rail%22
  IDFM_CARRIER_STOPS_URL: https://data.iledefrance-mobilites.fr/api/explore/v2.1/catalog/datasets/arrets-transporteur/exports/csv?select=arrid,privatecode&where=fournisseurname%3D%22SNCF%22%20and%20arttype%3D%22rail%22
  RELEASE_TAG: timetables

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download sources
        run: |
          mkdir -p sources/sncf sources/idfm
          curl --fail --location --silent --show-error --retry 3 --output sources/sncf.zip "$SNCF_URL"
          curl --fail --location --silent --show-error --retry 3 --output sources/idfm.zip "$IDFM_URL"
          unzip -q sources/sncf.zip -d sources/sncf
          # Only these files are used: the rest weighs over 200 MB unzipped.
          unzip -q sources/idfm.zip agency.txt routes.txt trips.txt stops.txt stop_times.txt calendar.txt calendar_dates.txt transfers.txt -d sources/idfm
          # IDFM's stop referential (Licence Ouverte): SNCF's code of each station, which real time uses.
          mkdir -p sources/idfm-codes
          curl --fail --location --silent --show-error --retry 3 --output sources/idfm-codes/arrets.csv "$IDFM_STOPS_URL"
          curl --fail --location --silent --show-error --retry 3 --output sources/idfm-codes/transporteur.csv "$IDFM_CARRIER_STOPS_URL"

      - name: Build files
        run: |
          python3 tools/build_timetable.py \
            --sncf sources/sncf \
            --idfm sources/idfm \
            --idfm-codes sources/idfm-codes \
            --out publication \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          cp data-licenses/ODbL-1.0.txt data-licenses/Licence-Mobilites.pdf data-licenses/SOURCES.md publication/

      - name: Publish files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" > /dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --title "Timetables" --notes-file data-licenses/SOURCES.md
          gh release upload "$RELEASE_TAG" --clobber \
            publication/sncf.bin.gz publication/idfm.bin.gz publication/corrections.json \
            publication/ODbL-1.0.txt publication/Licence-Mobilites.pdf publication/SOURCES.md

      - name: Prepare manifest
        run: |
          mkdir pages
          cp publication/manifest.json pages/manifest.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
